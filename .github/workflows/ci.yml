name: CI

# Synthetic-only CI for a public repository (DEP-02).
#
# Default permissions are read-only and no job references a repository secret.
# `pull_request` (not `pull_request_target`) means fork code runs without secrets,
# and nothing here needs one: every provider is a fake. Actions are pinned to SHAs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly health check of the default branch (main), Monday 03:17 UTC.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CS_DATA_MODE: fake
  AI_PROVIDER: fake
  APP_TIMEZONE: Asia/Taipei

jobs:
  verify:
    name: typecheck, lint, policy, unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Environment check (names only)
        run: npm run check:env

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Private-path policy
        run: npm run check:private

      - name: Secret scan (tracked files)
        run: npm run check:secrets

      - name: Secret scan (full history)
        run: |
          git log -p --all --format='commit %H' > "$RUNNER_TEMP/history.txt"
          node scripts/scan-secrets.mjs "$RUNNER_TEMP/history.txt"

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Package verified synthetic sweep server
        run: tar --exclude='.next/cache' --exclude='.next/trace' -cf "$RUNNER_TEMP/sweep-server.tar" .next

      - name: Upload verified synthetic sweep server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sweep-server
          path: ${{ runner.temp }}/sweep-server.tar
          retention-days: 1
          overwrite: true

  browser-shard:
    name: browser shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser journeys
        env:
          CS_SHOT_DIR: ${{ runner.temp }}/screens
          CS_SHOT_REPLIES_ONLY: '1'
        run: npm run test:e2e -- --project=w375 --project=w1280 --project=shadow-w375 --project=shadow-w1280 --shard=${{ matrix.shard }}/4

      # These contain only synthetic fake-provider pages, never owner data.
      - name: Upload Replies visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replies-screens-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/screens/
          retention-days: 7
          if-no-files-found: ignore

      # Page text in these reports is synthetic. Only the report directory is uploaded.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  browser-db-read:
    name: db-read cutover (both widths)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download verified synthetic server
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name sweep-server --dir "$RUNNER_TEMP/sweep-server"
      - name: Extract verified synthetic server
        run: tar -xf "$RUNNER_TEMP/sweep-server/sweep-server.tar"
      - name: Run DB-read cutover and health smoke journeys
        env:
          CS_E2E_PREBUILT: '1'
          CS_E2E_CONTENT_STORE: db-read
        run: npm run test:e2e -- tests/e2e/content-read-cutover.spec.ts tests/e2e/smoke.spec.ts --project=w375 --project=w1280
      - name: Upload synthetic cutover evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-read-cutover
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn

  browser-db-write:
    name: db-write cutover (both widths)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download verified synthetic server
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name sweep-server --dir "$RUNNER_TEMP/sweep-server"
      - name: Extract verified synthetic server
        run: tar -xf "$RUNNER_TEMP/sweep-server/sweep-server.tar"
      - name: Run DB-write cutover journeys
        env:
          CS_E2E_PREBUILT: '1'
          CS_E2E_CONTENT_STORE: db
        run: npm run test:e2e -- tests/e2e/markdown-authority.spec.ts tests/e2e/content-write-cutover.spec.ts tests/e2e/image-pipeline.spec.ts --project=w375 --project=w1280
      - name: Upload synthetic cutover evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-write-cutover
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn

  browser-sweep:
    name: exploratory sweep (both widths)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: verify
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download verified synthetic server
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name sweep-server --dir "$RUNNER_TEMP/sweep-server"
      - name: Extract verified synthetic server
        run: tar -xf "$RUNNER_TEMP/sweep-server/sweep-server.tar"
      - name: Run isolated sweep (240s reported budget, 360s hard ceiling)
        env:
          CS_E2E_PREBUILT: '1'
          CS_SWEEP_ISOLATED: '1'
        run: npm run test:e2e -- sweep --project=sweep-375 --project=sweep-1280 --project=sweep-fault-375 --project=sweep-fault-1280 --reporter=list,./tests/e2e/sweep-reporter.ts
      - name: Upload synthetic sweep coverage and findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exploratory-sweep
          path: |
            sweep-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

  browser:
    name: deterministic browser journeys
    runs-on: ubuntu-latest
    if: always()
    needs: [browser-shard, browser-sweep, browser-db-read, browser-db-write]
    steps:
      - name: Require every browser shard to pass
        env:
          SHARD_RESULT: ${{ needs.browser-shard.result }}
          SWEEP_RESULT: ${{ needs.browser-sweep.result }}
          DB_READ_RESULT: ${{ needs.browser-db-read.result }}
          DB_WRITE_RESULT: ${{ needs.browser-db-write.result }}
        run: test "$SHARD_RESULT" = success && test "$SWEEP_RESULT" = success && test "$DB_READ_RESULT" = success && test "$DB_WRITE_RESULT" = success

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
